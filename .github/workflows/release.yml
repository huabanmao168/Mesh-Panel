name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # 用 GITHUB_TOKEN 创建 release 和上传 asset

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- 前端 build ----
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Pack frontend dist
        run: tar -C frontend -czf frontend-dist.tar.gz dist

      # ---- agent 交叉编译 ----
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: agent/go.sum

      - name: Build agent (amd64 / arm64 / armv7)
        working-directory: agent
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p ../release
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 \
            go build -ldflags="-s -w -X main.Version=${VERSION}" \
            -o ../release/mesh-agent-amd64 .
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 \
            go build -ldflags="-s -w -X main.Version=${VERSION}" \
            -o ../release/mesh-agent-arm64 .
          GOOS=linux GOARCH=arm GOARM=7 CGO_ENABLED=0 \
            go build -ldflags="-s -w -X main.Version=${VERSION}" \
            -o ../release/mesh-agent-armv7 .

      - name: Move frontend tarball into release dir
        run: mv frontend-dist.tar.gz release/

      - name: Compute checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS

      # ---- 发 Release ----
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: MeshPanel ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/mesh-agent-amd64
            release/mesh-agent-arm64
            release/mesh-agent-armv7
            release/frontend-dist.tar.gz
            release/SHA256SUMS
