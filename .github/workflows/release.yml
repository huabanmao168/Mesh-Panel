name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build linux-amd64 single binary
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # --- Go: build agent binaries (3 archs) ---
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build agent binaries
        run: |
          cd agent
          make all VERSION=${GITHUB_REF_NAME#v}
          ls -lh ../backend/agent_dist/

      # --- Node: build frontend dist ---
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build
          ls -lh dist/

      # --- Python: install deps + pyinstaller ---
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller==6.20.0

      # --- PyInstaller: single binary ---
      - name: Build single binary
        run: |
          pyinstaller --clean --noconfirm mesh-panel.spec
          ls -lh dist/
          file dist/mesh-panel

      - name: Smoke test binary
        run: |
          # 用临时 HOME 跑一下,health 200 才算过
          MESH_PANEL_HOME=/tmp/smoke-test ./dist/mesh-panel &
          PID=$!
          sleep 5
          curl -fsS http://127.0.0.1:8000/api/health
          echo ""
          curl -fsS -o /dev/null -w "GET / → %{http_code}\n" http://127.0.0.1:8000/
          kill $PID
          wait $PID 2>/dev/null || true

      - name: Rename for release
        run: |
          cd dist
          mv mesh-panel mesh-panel-linux-amd64
          sha256sum mesh-panel-linux-amd64 > mesh-panel-linux-amd64.sha256
          ls -lh

      # --- Publish Release ---
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/mesh-panel-linux-amd64
            dist/mesh-panel-linux-amd64.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
